<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AEC OMR System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <h1>AEC OMR System</h1>
        <div class="navbar-links">
            <a href="/">Login</a>
            <a href="/register">Register</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <h2>Reset Password</h2>
            <p class="auth-subtitle">Enter your email to receive a 6-digit OTP.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div style="margin-bottom: 1rem;">
                    {% for category, message in messages %}
                        <div class="{{ category }}">{{ message }}</div>
                    {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form action="/forgot_password" method="POST">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Enter your registered email" required>
                </div>
                <button type="submit" class="btn btn-dark">Send OTP Verification</button>
            </form>

            <div class="link-text">
                Remembered it? <a href="/">Return to Login</a>
            </div>
        </div>
    </div>

</body>
</html>
